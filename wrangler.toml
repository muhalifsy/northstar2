name = "northstar2"
main = "_worker.js"
compatibility_date = "2026-06-01"

[assets]
directory = "./"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "northstar2"
database_id = "6c1fab4d-84ef-46e1-862b-ff471b70904b"

# 06:00 UTC daily: split scan. :15 hourly: crypto prices + rotating crypto
# candle tails, and at 06:15 the TL deposit / USD GS3M curves (see scheduled()).
[triggers]
crons = ["0 6 * * *", "15 * * * *"]
